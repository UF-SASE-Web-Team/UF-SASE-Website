name: Discord Notifications

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, closed, review_requested, ready_for_review, reopened, locked, unlocked]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          
          description: |
            **Branch:** ${{ github.actor }} ![avatar](https://github.com/${{ github.actor }}.png?size=32)
            **User:** `${{ github.actor }}`
            **Message:** `${{ github.event.pull_request.title || github.event.head_commit.message }}`
          
          # Green for PR merge, Blue for PR open, Purple for Push
          color: >-
            ${{ 
              (github.event.pull_request.merged == true) && '0x28a745' || 
              (github.event_name == 'pull_request') && '0x005EB8' || 
              '0x6f42c1' 
            }}